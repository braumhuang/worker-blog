name = "worker-blog"
main = "src/index.tsx"
compatibility_date = "2026-07-15"
workers_dev = true
preview_urls = true

[vars]
MAX_UPLOAD_MB = "25"

[[d1_databases]]
binding = "BLOG_DB"
database_name = "worker-blog"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BLOG_R2"
bucket_name = "worker-blog-assets"

[[send_email]]
name = "BLOG_EMAIL"

[assets]
directory = "./static"
